spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      batch-listener: true
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 2
    topics:
      like-event: like_event
      comment-event: comment_event
      post-event: post_event
      post-viewed-event: post_viewed_event
      feed-heat-event: feed_heat_event
      subscribers-feed-heat-event: subscribers_feed_heat_event
    variables:
      partitions: 4
      replicas: 1

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis-master:
      port: 6379
      host: localhost
      channels:
          calculations_channel_name: cal
          user_ban_name: user_ban
          like_event_name: like_event
          comment_topic: comment_topic
          post_view_name: post_view
    redis-news-feed:
      port: 6380
      host: localhost
      feed-size: 500
      user-ttl: 1
      post-ttl: 1
      comments-limit: 3

  task:
    execution:
      pool:
        size: 10
        max-size: 10

server:
  port: 8081

logging:
  level:
    root: info

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  user-service:
    host: localhost
    port: 8080
  project-service:
    host: localhost
    port: 8082
  payment-service:
    host: localhost
    port: 9080
scheduler:
  expired-ad:
    batch-size: 100
    cron: 0 0 0 * * ?

executor-service:
  threads-count: 2
  termination-timeout: 30

springdoc:
  swagger-ui:
    path: /swagger-ui
    enabled: true
  api-docs:
    path: /api-docs


project:
    ban-user:
      cron: 0 0 1 * * *
    post-publisher:
      cron: "0 * * * * *"

thread:
  pool:
    coreSize: 5
    maxSize: 10
    prefix: "post-publisher-"
  redis:
    pool:
      coreSize: 5
      maxSize: 10
      prefix: "news-feed-cache-"

entity:
    post:
        max-unverified-count-for-ban: 5
    commentServiceFileLimitMb: 5
languagetool:
  apiUrl: "https://api.languagetool.org/v2/check"
  language: "auto"

retry:
  text-auto-correction-api:
    max-attempts: 3
    backoff:
      delay: 2000
      multiplier: 1.5

news-feed:
  heater:
    batch-size: 1000
  api-version: "/api/v1"
  api-endpoint: "/feed"
