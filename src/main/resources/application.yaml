spring:
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security:
        protocol: PLAINTEXT
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: postCreated:faang.school.postservice.dto.post.PostCreatedEventDto

    consumer:
      group-id: post-service-feed
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: true
        spring.json.trusted.packages: "faang.school.postservice.dto.post"
        spring.json.value.default.type: faang.school.postservice.dto.post.PostCreatedEventDto
        spring.json.type.mapping: postCreated:faang.school.postservice.dto.post.PostCreatedEventDto

    listener:
      ack-mode: manual
      # чтобы не прилетали пачки сообщений при ручном ack (обычно в учебных проектах так проще)
      type: single

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

scheduler:
  cron:
    expression: 0 * * * * *
    zone: GMT
  thread-pool:
    size: 10
    batchSize: 50

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info
    faang.school.postservice.service.FeedServiceImpl: DEBUG

user-service:
  host: localhost
  port: 8080
  context-path: /api/v1

project-service:
  host: localhost
  port: 8082
  context-path: /api/v1

payment-service:
  host: localhost
  port: 9080
  context-path: /api/v1

like:
  chunk:
    size: 100

springdoc:
  override-with-generic-response: false

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket

app:
  kafka:
    topics:
      posts-created-topic: posts-created-topic
  resources:
    image:
      max-file-size-mb: 5
      max-per-post: 10
      type: "IMAGE"
  feed:
    controller:
      default-limit: 20
    redis:
      max-size: 500
      key-prefix: "feed:v1:"
      post-ttl: 2h
      user-ttl: 6h
  outbox:
    dispatcher:
      fixed-delay-ms: 1000
    handlers:
      post-created:
        event-type: postCreated
        payload-class: faang.school.postservice.dto.post.PostCreatedEventDto

post-correcter:
  cron: "0 0 3 * * *" # every day at 3:00

languagetool:
  api-url: "https://api.languagetool.org"
  language: "auto"

