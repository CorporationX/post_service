spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        user-ban: user-ban
        postViewEventPublisher: PostViewEvent_topic
        comment_channel: comment_topic
        like-event: likeEventTopic
      ttl-days-posts: 1
      ttl-days-users: 1
      object-cache-options:
        posts-count: 500
        comments-count: 3
        returning-posts-count: 20
    kafka:
      bootstrap-servers: localhost:9092
      topic:
        comment: comment_topic
        userBan: user_ban
        hashtag-adding:
          name: "hashtag-adding-topic"
          partitions: 3
          replicas: 1
        hashtag-removing:
          name: "hashtag-removing-topic"
          partitions: 3
          replicas: 1
        followers-request:
          name: "post-followers-topic"
          partitions: 3
          replicas: 1
        posts:
          name: "posts-topic"
          partitions: 3
          replicas: 1
        comment-added:
          name: "comment-added-topic"
          partitions: 3
          replicas: 1
        like-added:
          name: "like-added-topic"
          partitions: 3
          replicas: 1
        like-removed:
          name: "like-removed-topic"
          partitions: 3
          replicas: 1
        posts-view:
          name: "post-view-topic"
          partitions: 3
          replicas: 1
        author-request:
          name: "author-request-topic"
          partitions: 3
          replicas: 1
        author-response:
          name: "author-response-topic"
          partitions: 3
          replicas: 1
      producer:
        retry-backoff-ms: 1000
        acks: all
        enable-idempotence: true
      consumer:
        group-id: post-group
        auto-offset-reset: earliest

  profiles:
    active: local

server:
  port: 8081

logging:
  level:
    root: debug

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080
hashtag-service:
  host: localhost
  port: 8090

thread-pool:
  delete-expired-posts-max-threads: 3
  publish-posts-max-threads: 10
  publish-timeout: 3
  author-ban:
    size: 2
    shutdown-timeout-seconds: 30

batch:
  size: 1000

cron:
  delete-expired-posts: 0 49 15 * * FRI
  author-ban: 0 0 0 * * *
  comment-ban: 0 13 18 * * FRI

ban-properties:
  value-rejected-posts: 5
