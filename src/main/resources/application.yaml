spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 170MB

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: "localhost:9092"
    topic:
      posts: "posts"
      post-views: "postViews"
      likes: "likes"
      comments: "comments"
      partitions: 48
      replicas: 3
      retention-ms: "86400000"
      cleanup-policy: "delete"
      min-in-sync-replicas: "2"
      unclean-leader-election: "false"
    consumer:
      group-id: "post-consumer-group"
      enable-auto-commit: false
      auto-offset-reset: "earliest"
    producer:
      acks: "all"
      idempotence: true
      retries: 3
      max-in-flight-requests: 5
      compression-type: "zstd"

  data:
    redis:
      port: 6379
      host: localhost
      timeout: 100
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000
      lettuce-pool:
        max-total: 20
        max-idle: 10
        min-idle: 2
        max-wait: 3000
      health-checker:
        min-cache-keys: 5
        redis-unavailable-ttl-sec: 300
        reconnection-interval-sec: 2
        initial-delay-sec: 0
        redis-unavailable-key: "redis:unavailable"
        retry:
          delay-ms: 1000
          multiplier: 2
        health-check-scheduler:
          fixed-rate-ms: 30000
        executor:
          await-termination-sec: 5
      channels:
        comment: comment_channel
        calculations_channel:
          name: calculations_channel
        like-channel:
          name: like_channel
        not-like-channel:
          name: not-like-channel

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true
    filter: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: multipart/form-data
  default-produces-media-type: application/json

server:
  port: 8081
  address: 0.0.0.0

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

amazonS3:
  endpoint: http://127.0.0.1:9000
  access-key: user
  secret-key: password
  bucket-name: corpbucket
  region: ap-southeast-2

file-upload:
  post:
    minimum-amount: 1
    maximum-amount: 10
    info-by-file-type:
      image:
        max-size: 5242880
        allowed-extensions:
          - jpg
          - jpeg
          - png
      video:
        max-size: 157286400
        allowed-extensions:
          - mp4
          - mkv
          - avi
          - mov
          - quicktime
      audio:
        max-size: 10485760
        allowed-extensions:
          - mp3
          - wav
          - ogg
          - mpeg
      another:
        max-size: 0
        allowed-extensions: [ ]
    image-size-limits:
      square:
        max-length: 1080
      rectangular:
        max-long-side-length: 1080
        max-short-side-length: 566

task-executor:
  file-upload:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 50
  redis-reconnect:
    pool-size: 1
    await-termination-seconds: 10
    thread-name-prefix: "redis-reconnect-"
    daemon: true
    remove-on-cancel-policy: true
    wait-for-tasks-to-complete-on-shutdown: true
  scheduled-task:
    pool-size: 8
    await-termination-seconds: 10
    thread-name-prefix: "scheduled-task-"
    daemon: true
    wait-for-tasks-to-complete-on-shutdown: true

comment-img:
  max-size-bytes: 5242880
  sizes:
    large: 1080
    small: 170
ad:
  expired:
    cronExpiredPostAdDeletion: "0 0 1 * * *"
    cron-one-minute: "0 0 1 * * ?"
  deletion:
    batchSize: 100

post-corrector:
  cron:
    every-day-at-three-pm: "0 0 3 * * ?"
  fixed-delay:
    outbox-event:
      every-five-second: 5000

grammar-bot:
  api:
    url: "https://grammarbot.p.rapidapi.com/check"
    key: "812b9b6481mshc1aae881c0c2f03p1411dfjsne87203f42d87"

moderation:
  dictionary: classpath:moderation/bad-words.txt
  cron-expression: 0 0 2 * * ?
  batch-size: 100
  core-pool-size: 10
  max-pool-size: 20
  queue-capacity: 50
  cron: "0 0 3 * * *"  # каждый день в 03:00   0 0 3 * * *
  chunk-size: 100     # количество комментов в одном потоке

scheduler:
  outbox-event:
    batch-size: 10

feed:
  max-feed-size: 1000
  max-comments: 50
  feed-ttl: 86400
  post-ttl: 259200
  event-id-ttl: 3600
  cache-warmer-user-batch-size: 50
