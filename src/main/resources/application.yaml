spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        postView: post_view_channel
        calculations_channel:
          name: calculations_channel

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost:8080
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

minio:
  endpoint: http://localhost:9000
  username: user
  password: password
  bucket-name: corpbucket
  region: ru-central1

resource:
  max-files-per-post: 10

  image:
    max-file-size-mb: 5
    allowed-types:
      - image/jpeg
      - image/cvg
    resize:
      square:
        width: 1080
        height: 1080
      horizontal:
        width: 1080
        height: 566

  video:
    max-file-size-mb: 50
    allowed-types:
      - video/mp4

  audio:
    max-file-size-mb: 10
    allowed-types:
      - audio/mpeg
      - audio/ogg

post:
  correcter:
    cron: "0 0 3 * * *"
    retry:
      max-attempts: 3
      delay: 2000

language-tool:
  url: https://api.languagetool.org/v2/check
  language: ru-RU
