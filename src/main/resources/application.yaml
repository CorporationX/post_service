spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
        user-ban: user-ban
        postViewEventPublisher: PostViewEvent_topic
        comment_channel: comment_topic
        like-event: likeEventTopic
      ttl:
        post: 86400
        author: 86400
      feed:
        size: 500
        global-size: 1000
        limit: 20
      comments:
        size: 3

    kafka:
      bootstrap-servers: localhost:9092
      standard-partitions-count: 3
      topic:
        comment: comment_topic
        userBan: user_ban
        posts: posts
        likes: likes
        heat: heat
        hashtag-adding:
          name: "hashtag-adding-topic"
          partitions: 3
          replicas: 1
        hashtag-removing:
          name: "hashtag-removing-topic"
          partitions: 3
          replicas: 1
      producer:
        retries: 3
        retry-backoff-ms: 1000
        acks: all
      consumer:
        group-id: post-group
        auto-offset-reset: earliest
        trusted-packages: "*"

  profiles:
    active: local

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080
hashtag-service:
  host: localhost
  port: 8090

thread-pool:
  delete-expired-posts-max-threads: 3
  publish-posts-max-threads: 10
  publish-timeout: 3
  heater-feed-size: 10
  author-ban:
    size: 2
    shutdown-timeout-seconds: 30

batch:
  size: 1000

cron:
  delete-expired-posts: 0 49 15 * * FRI
  author-ban: 0 0 0 * * *
  comment-ban: 0 13 18 * * FRI

ban-properties:
  value-rejected-posts: 5
