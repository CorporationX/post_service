spring:
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 5MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    topics:
      comment-created-topic:
        name: comment-created-notification

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

notifications:
  symbol-amount-for-short-content: 20

minio:
  endpoint: http://localhost:9000
  access-key: user
  secret-key: password
  bucket: corpbucket
  region: us-east-1
  path-style-access: true
  max-file-size-mb: 5


moderation:
  comments:
    cron: "*/15 * * * * *"
    batch_size: 1000
  executor:
    thread_pool_max_size: 1000
    thread_pool_core_size: 500

app:
  correction:
    url: "https://api.languagetool.org/v2/check"
    language: "auto"
    cron: "0 */30 * * * *" # каждые 30 минут
    batch-size: 500
  executor:
    thread_pool_core_size: 25
    thread_pool_max_size: 100
    send-kafka-message:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      prefix: send-kafka-message-

  cache:
    user:
      key-prefix: user
      ttl: 86400 # сутки
    post:
      key-prefix: post
      ttl: 86400 # сутки
    comment:
      key-prefix: comment


scheduled-post-publisher:
  comments:
    cron: "0 * * * * *"
    batch_size: 1000
  executor:
    thread_pool_core_size: 8
    thread_pool_max_size: 16