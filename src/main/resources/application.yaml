spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

services:
  s3:
    endpoint: http://192.168.1.100:9000
    accessKey: user
    secretKey: password
    bucketName: post-bucket

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094
    producer:
      client-id: user-service
      acks: all
      properties:
        linger:
          ms: 0
    consumer:
      group-id: analytics-created

  redis:
    host: localhost
    port: 6379

  consul:
    host: localhost
    port: 8500
