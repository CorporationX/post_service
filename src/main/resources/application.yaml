spring:
  config:
    import: 'optional:consul:'
  application:
    name: post-service
  cloud:
    consul:
      host: 158.160.192.60
      port: 8500
      discovery: post-service-i1
      config:
        enabled: true
        watch:
          enabled: true
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 5000
            readTimeout: 3000
            loggerLevel: full
    aws:
      credentials:
        access-key: user
        secret-key: password
      region:
        static: us-east-1
      s3:
        endpoint: http://...:9000
        path-style-access-enabled: true
        bucket-name: post-bucket

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
  kafka:
    retry:
      attempts: 3
      backoff-delay: 1000 # 1 секунда
    consumer:
      bootstrap-servers: localhost:9092, localhost:9094
      group-id: post-service
      max-poll-records: 50
      offset-reset-config: latest
    topics:
     comment-event:
      name: comment-event-topic
      concurrency: 3
     like-event:
       name: like-event-topic

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8081

logging:
  level:
    root: info

services:
  user-service:
    name: user-service
  project-service:
    name: project-service
  payment-service:
    name: payment-service

management:
  tracing:
    sampling:
      probability: 1.0
    enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

cache:
  default-ttl-seconds: 3600
  like:
    ttl:
      minutes: 10
  user:
    ttl:
      minutes: 30

feign:
  retry:
    maxAttempts: 3
    delay: 1000
    multiplier: 2


scheduler:
  update-expired-ads:
#    cron: 0/5 * * * * ?
    cron: 0 */15 * * * ?
  delete-expired-ads:
#    cron: 0/15 * * * * ?
    cron: 0 30 3 * * ?
    batch-size: 1000

expired-ads:
  async:
    pool-size: 3
    max-pool-size: 6
    queue-capacity: 100
    thread-name-prefix: expired-ads-thread

app:
  redis:
    post:
      max-comments: 3
      retry: 5
      backoff-delay: 1000