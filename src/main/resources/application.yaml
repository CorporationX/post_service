spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      group-id: post_service
      properties:
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy

    topics:
      post-comment-publish:
        name: posts.comments.publish
        executor:
          core-pool-size: 2
          max-pool-size: 5
          queue-capacity: 50
      post-like-publish:
        name: posts.likes.publish
      post-view:
        name: posts.view
      post:
        name: posts
        batch: 100

  data:
    redis:
      port: 6379
      host: localhost
      cache:
        comments:
          max: 3
          ttl: 86400
        authors:
          ttl: 86400
          lock-sec-ttl: 10
          waiting-sec-lock: 5
        posts:
          ttl: 86400
        feed:
          ttl: 86400
          limit: 500
          per-page: 20

      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8085

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

scheduler:
  post-correction-cron: "0 0 2 * * *"

post:
  correction:
    batch-size: 50
    core-size: 4
    max-size: 8
    queue-capacity: 100

