spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  config:
    import: 'optional:consul:config/post-service/'
  application:
    name: post-service
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        watch:
          enabled: true

    aws:
      credentials:
        access-key: user
        secret-key: password
      region:
        static: us-east-1
      s3:
        endpoint: http://...:9000
        path-style-access-enabled: true
        bucket-name: post-bucket

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8081

logging:
  level:
    root: info

services:
  user-service:
    name: user-service
  project-service:
    name: project-service
  payment-service:
    name: payment-service

scheduler:
  update-expired-ads:
#    cron: 0/5 * * * * ?
    cron: 0 */15 * * * ?
  delete-expired-ads:
#    cron: 0/15 * * * * ?
    cron: 0 30 3 * * ?
    batch-size: 1000

expired-ads:
  async:
    pool-size: 3
    max-pool-size: 6
    queue-capacity: 100
    thread-name-prefix: expired-ads-thread