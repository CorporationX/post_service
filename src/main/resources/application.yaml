spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
  kafka:
    bootstrap-servers: localhost:9094
    properties:
      security:
        protocol: PLAINTEXT

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: post-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false

kafka:
  topic:
    user-ban: user_ban
    comment-event: comment_events
    posts: posts

server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
  servlet:
    context-path: /api
  retryable:
    maxAttempts: 3
    delay: 1000
    multiplier: 2

project-service:
  host: localhost
  port: 8082
  servlet:
    context-path: /api
payment-service:
  host: localhost
  port: 9080

threads:
  delete-ads-pool-size: 3

cron:
  delete-expired-ads-cron: 0 0 0 * * *
  find-authors-for-ban-cron: 0 0 0 * * *
  moderate-posts-cron: 0 0 0 * * *

ads:
  max-delete-per-thread: 100

app:
  scheduled-posts:
    thread-pool-size: 10
    batch-size: 1000
    cron: "0 * * * * *"
posts:
  max-unverified-posts: 5
  find-unverified-posts-page-size: 100
  max-posts-to-moderate-per-thread: 10

files-path:
  offensive-words: src/main/resources/offensive-words.txt

feed:
  max_size: 500
  collection: feed
  ttl: 24  # 24 часа