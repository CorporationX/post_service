spring:
  application:
    name: post-service

  config:
    import: optional:classpath:application.properties

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    topics:
      post-created: "post.created"
      post-to-feed: "post.to-feed"
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  outbox:
    fixed-delay-ms: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
      enabled: true

  jackson:
    default-property-inclusion: non_null

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  profiles:
    active: ${APP_ENV}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      channels:
        calculations_channel:
          name: calculations_channel
      user-ban-topic: "user-ban-topic"
      posts-ttl-seconds: 86400
      posts-key-prefix: posts

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

services:
  s3:
    endpoint: ${MINIO_END_POINT}:${MINIO_PORT}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    bucketName: ${MINIO_BUCKET_NAME}

    posts:
      upload:
        max-image-count: 10
        format: ".jpeg,.pdf,.webp,.png,.ico,.jpg"
      download:
        times-live-url-minutes: 10
        size:
          max: 5242880
      image:
        horizontal:
          max-width: 1080
          max-height: 566
        square:
          max-width: 1080
          max-height: 1080

executor:
  thread-count: 10
  max-thread-pool: 30
  await-time-seconds: 30


redis:
  topics:
    user-ban-topic: "user-ban-topic"

scheduler:
  ad:
    time-to-remove: "0 0 23 * * *"
  comment:
      ban-user-invoke: "0 0 23 * * *"
      count-ban-size: 5
  posts:
    cron: "0 0 1 * * *"
    ban-threshold: 5

