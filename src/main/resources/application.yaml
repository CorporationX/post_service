spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: post-group
      auto-offset-reset: earliest
    topics:
      likeTopic: like-topic
      commentTopic: comment-topic
      postTopic: post-topic
      newsFeedTopic: newsfeed-topic

server:
  port: 8081

logging:
  level:
    root: info

# swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

application:
  followers:
    chunk-size: 5
  redis:
    news-feed-cache-limit: 10
    news-feed-time-to-live: 300 # in seconds
    post-time-to-live: 300 # in seconds
    user-time-to-live: 300 # in seconds