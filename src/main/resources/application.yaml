spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

scheduler:
  cron:
    expression: 0 * * * * *
    zone: GMT
  thread-pool:
    size: 10
    batchSize: 50

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info
user-service:
  host: localhost
  port: 8080
  context-path: /api/v1
project-service:
  host: localhost
  port: 8082
  context-path: /api/v1

payment-service:
  host: localhost
  port: 9080
  context-path: /api/v1

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket

app:
  resources:
    image:
      max-file-size-mb: 5
      max-per-post: 10
      type: "IMAGE"

