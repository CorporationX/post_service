spring:
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 5MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

minio:
  endpoint: http://localhost:9000
  access-key: user
  secret-key: password
  bucket: corpbucket
  region: us-east-1
  path-style-access: true
  max-file-size-mb: 5

app:
  correction:
    upl: "https://api.languagetool.org/v2/check";
    language: "auto";
    cron: "0 0 12 * * ?"
    retry:
      maxAttempts: 3
      delay: 1000