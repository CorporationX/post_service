spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 2MB

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

    kafka:
      bootstrap-servers: localhost:29092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringDeserializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        properties:
          spring.json.add.type.headers: false
        acks: 1
        retries: 5
        spring.json.add.type.headers: false
      consumer:
        group-id: news-feed
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto-offset-reset: earliest
        enable-auto-commit: false
      topics:
        comment-created-topic:
          name: comment-created-notification
        comments:
          name: comments

file:
  max-size: 10485760

cloud:
  aws:
    s3:
      endpoint: http://127.0.0.1:9000
      bucket: corpbucket
      access-key: user
      secret-key: password
    region:
      static-region: eu-central-1

server:
  port: 8081

logging:
  level:
    root: info

services:
  user-service:
    host: localhost
    port: 8080

  project-service:
    host: localhost
    port: 8082

  payment-service:
    host: localhost
    port: 9080

  language-tool:
    url: https://api.languagetool.org
    version: v2

jobs:
  spellcheck:
    cron: "0 * * * * *"
    # каждую минуту

app:
  executor:
    thread_pool_core_size: 25
    thread_pool_max_size: 100
    send-kafka-message:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      prefix: send-kafka-message-

  cache:
    user:
      key-prefix: user
      ttl: 86400
    post:
      key-prefix: post
      ttl: 86400
    comment:
      key-prefix: comment
