spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      timeout: 2000ms
      database: 0
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
        channels:
          calculations_channel:
            name: calculations_channel
          comment_events:
            name: comment.events

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      client-id: post-service-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        retry.backoff.ms: 1000
        delivery.timeout.ms: 120000
        linger.ms: 5
        batch.size: 16384
        compression.type: snappy
        enable.idempotence: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: 5000
            read-timeout: 5000

server:
  port: 8081

logging:
  level:
    root: info
    faang.school.postservice.events: debug
    org.springframework.data.redis: info
    org.apache.kafka: info
    org.springframework.kafka: debug
    faang.school.postservice.producer: debug

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

ad-remover:
  batch-size: 10
  thread-pool:
    size: 20
  cron: "0 0 2 * * ?"

app:
  kafka:
    topics:
      posts:
        name: posts
        partitions: 3
        replication-factor: 1
      post-views:
        name: post_views
        partitions: 5
        replication-factor: 1
  redis:
    post-cache:
      ttl-hours: 24
      database: 1
      key-prefix: "post:"
      user-feed-prefix: "user_feed:"
      trending-posts-key: "trending_posts"

events:
  redis:
    topics:
      comment: "comment.events"
    retry:
      max-attempts: 3
      delay: 1000ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: post-service