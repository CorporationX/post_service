spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        comment: comment_channel
        postView: post_view_channel
        like: like_channel
      channel:
        likeReceived: likes_received
        postCreated: post_created

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      group-id: ${KAFKA_POSTS_GROUP_ID:post-service-posts}
      enable-auto-commit: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost:8080
project-service:
  host: localhost:8082
payment-service:
  host: localhost:9080

minio:
  endpoint: http://localhost:9000
  username: user
  password: password
  bucket-name: corpbucket
  region: ru-central1

resource:
  max-files-per-post: 10

  image:
    max-file-size-mb: 5
    allowed-types:
      - image/jpeg
      - image/cvg
    resize:
      square:
        width: 1080
        height: 1080
      horizontal:
        width: 1080
        height: 566

  video:
    max-file-size-mb: 50
    allowed-types:
      - video/mp4

  audio:
    max-file-size-mb: 10
    allowed-types:
      - audio/mpeg
      - audio/ogg

post:
  correcter:
    cron: "0 0 3 * * *"

language-tool:
  url: https://api.languagetool.org/v2/check
  language: ru-RU

scheduler:
  batch-size: 1000
  thread-pool-size: 10
  cron-expression: "0 * * * * *"

app:
  cache:
    feed:
      key-prefix: feed
      max-size: 1000

  feed:
    heater:
      threads: 8
      per-user-post-limit: 500

  kafka:
    topics:
      posts: ${KAFKA_POSTS_TOPIC:posts}