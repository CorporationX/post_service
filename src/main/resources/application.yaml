spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    host: localhost:9092
    num-partitions: 3
    replication-factor: 1
    topics:
      post-views: post_views
      like-post: like_post
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: post-view-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "faang.school.postservice.dto.kafka"
        spring.json.value.default.type: "faang.school.postservice.dto.kafka.PostViewEvent"



server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

kafka:
   host: "localhost:9092"
   group: post-service
   topics:
     like-post: "like-post"
     posts:
      create-post: "create-post"

   num-partitions: 2
   replication-factor: 1
   properties:
     security.protocol: SSL
     ssl.truststore.location: /path/to/truststore.jks
     ssl.truststore.password: password

cache:
  max-posts: 500
  expiration-hours: 24

feed:
  feed-key: "Feed: "

redis:
  channels:
    comment_event: comment_event_topic

