spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
        user_ban:
          name: user_ban

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: news-feed
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-attempts: 3
      interval-between-attempts: 1000
      properties:
        spring:
          json:
            trusted:
              packages: faang.school.postservice.events.*

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

app:
  rude-words-analyzer-schedule: 0 * * * * *
  ban-users-action-schedule: 0 * * * * *
  comments-processing-batch-size: 1000
  moderation:
    post-count-threshold: 5
  rude-words:
    - плохое_слово_1
    - плохое_слово_2
    - плохое_слово_3

ads:
  cleanup:
    cron: "0 0 12 * * *"
    num-chunks: 3

news-feed:
  posts:
    redis-ttl: 86400
    max-comments-count: 3
    topic: posts
    kafka-publish-batch-size: 1000
  users:
    redis-ttl: 86400
  likes:
    topic: likes
  feed:
    redis-ttl: 86400
    max-redis-feed-size: 500
    thread-pool-size: -1