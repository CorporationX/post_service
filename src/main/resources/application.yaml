spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel
  kafka:
    bootstrap-servers: localhost:9092
    topics:
      like-events: "like-events-topic"
      unlike-events: "unlike-events-topic"
      comments: comment.event
      post-view: analytics.post-view
      analytics: analytics.comment-analysis

  task:
    execution:
      pool:
        post-event:
          core-size: 5
          max-size: 10
          queue-capacity: 100
          thread-name-prefix: "PostEvent-"

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

ai:
  spellcheck-url: https://speller.yandex.net/services/spellservice.json/checkText

post-correcter:
  cron: "*/30 * * * * *"

app:
  moderation:
    time: 30000