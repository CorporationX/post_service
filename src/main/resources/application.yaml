spring:
  config:
    import: optional:classpath:application.properties

  servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 50MB
        enabled: true

  jackson:
    default-property-inclusion: non_null

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  profiles:
    active: ${APP_ENV}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

services:
  s3:
    endpoint: ${MINIO_END_POINT}:${MINIO_PORT}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    bucketName: ${MINIO_BUCKET_NAME}

    posts:
      upload:
        max-image-count: 10
        format: ".jpeg,.pdf,.webp,.png,.ico,.jpg"
      download:
        times-live-url-minutes: 10
        size:
          max: 5242880
      image:
        horizontal:
          max-width: 1080
          max-height: 566
        square:
          max-width: 1080
          max-height: 1080

redis:
  topics:
    user-ban-topic: "user-ban-topic"

scheduler:
    comment:
        ban-user-invoke: "0 0 23 * * *"
        count-ban-size: 5


