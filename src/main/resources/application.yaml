spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id:
        posts: posts-group
    topic:
      posts:
        name: posts-topic
        partition-count: 4

server:
  port: 8081

logging:
  level:
    root: info
    org.zalando.logbook: TRACE

like:
  batch: 100

posts:
  followees:
    batch: 1000

cache:
  feed:
    name: feed
    batch: 500
    time-to-live: 24h

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

scheduling:
  cron: "0 0 0 * * ?"
  cronExpression: "0 0 12 * * ?"
  initialDelay: 30000
  fixedRate: 30000
thread-pool:
  core-size: 3
  max-size: 5
  queue-capacity: 10
batch:
  size: 2