spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  kafka:
    bootstrap-servers: localhost:9092
    backoff:
      init-interval: 1000
      max-retries: 2
      max-interval: 5000
      multiplier: 2
    producer:
      enable-idempotence: true
      acks: all
    consumer:
      group-id: post-group
      auto-offset-reset: earliest
    topic:
      commentNew: comment.new
      postNew: post.new
      postView: post.view
      postLike: post.like
      feedHeat: feed.heat

post:
  followersBatch: 1000

thread-pool:
  fixed:
    size: 4

feed:
  key: feed
  keySet: posts
  ttl: 86400
  maxStored: 500
  comment:
    limit: 3
    ttl: 86400
  post:
    key: posts
    keySet: comments
    ttl: 86400
  user:
    ttl: 86400
    batch: 1000

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080
