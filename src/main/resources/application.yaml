spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
  servlet:
    context-path: /api
project-service:
  host: localhost
  port: 8082
  servlet:
    context-path: /api
payment-service:
  host: localhost
  port: 9080
s3:
  endpoint: http://localhost:9000
  accessKey: user
  secretKey: password
  bucketName: corpbucket
app:
  resources:
    max-file-size: 5242880
    max-files-per-post: 10
    image-max-width: 1080
    image-max-height: 1080
    allowed-content-types:
      - "image/jpeg"
      - "image/png"
      - "image/gif"
      - "video/mp4"
      - "audio/mpeg"