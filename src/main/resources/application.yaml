spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
  context-path: /api/v1
project-service:
  host: localhost
  port: 8082
  context-path: /api/v1
payment-service:
  host: localhost
  port: 9080
  context-path: /api/v1

post-correcter:
  cron: "0 0 3 * * *" # every day at 3:00

languagetool:
  api-url: "https://api.languagetool.org"
  language: "auto"