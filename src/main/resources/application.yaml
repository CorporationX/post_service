spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      enable-idempotence: true
      acks: all
    topic:
      commentNew: comment.new
      like: likes

post-kafka:
  enabled: true
  consumer:
    topic: posts
    group-id: post

audit-kafka:
  enabled: false
  backoff:
    init-interval: 1000
    max-retries: 2
    max-interval: 5000
    multiplier: 2

server:
  port: 8081

logging:
  level:
    root: info

integration:
  user-service:
    host: localhost
    port: 8888
    get-user-url: /api/user
  project-service:
    host: ${PROJECT_SERVICE_HOST:localhost}
    port: 8082
    get-project-url: /api/project
  payment-service:
    host: localhost
    port: 9080

redis:
  host: localhost
  port: 6379
  post-expire: 86400000
  comment-expire: 86400000

feed:
  max-size: 500
