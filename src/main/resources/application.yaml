spring:

  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      password: password
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      channels:
        calculations_channel:
          name: calculations_channel
        comment_event_channel:
          name: comment_event
        like: like_channel
        comment: achievement_channel
      lock:
        timeout: 5000
        wait-time: 3000

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: post-service-like-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "likeEvent:faang.school.postservice.event.LikeEvent"
      topics:
        like_topic: post_likes

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8081

logging:
  level:
    root: info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080

cleanup:
  cron: "0 0 0 * * *"
  chunk-size: 1000
scheduling:
  commenter-banner:
    cron: 0 0 10 * * *
app:
  cron:
    check-spelling: "0 0 0 * * *"

textgears:
  base-url: https://api.textgears.com
  api:
    key: "test_api_key_for_development_12345"
