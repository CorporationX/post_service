openapi: 3.0.3
info:
  title: Like Service API
  version: v1.0.0
  description: API для управления лайками на постах и комментариях.
  contact:
    name: Команда Разработки
    email: dev@example.com
servers:
  - url: http://localhost:8081
    description: Локальный сервер разработки

tags:
  - name: Like Management
    description: Операции для добавления и удаления лайков

components:
  schemas:
    LikeDto:
      type: object
      description: DTO для лайка
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор лайка. Обычно устанавливается сервером.
          readOnly: true
        userId:
          type: integer
          format: int64
          description: ID пользователя, поставившего лайк.
        commentId:
          type: integer
          format: int64
          description: ID комментария, которому поставлен лайк (если лайк относится к комментарию).
          nullable: true
        postId:
          type: integer
          format: int64
          description: ID поста, которому поставлен лайк (если лайк относится к посту).
          nullable: true

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
        status:
          type: integer
          description: HTTP статус код ошибки
        error:
          type: string
          description: Краткое описание типа ошибки (например, "Bad Request")
        message:
          type: string
          description: Подробное сообщение об ошибке
        path:
          type: string
          description: Путь запроса, на котором произошла ошибка

  parameters:
    PostIdParameter:
      name: postId
      in: path
      required: true
      description: Идентификатор поста
      schema:
        type: integer
        format: int64
        minimum: 1
    UserIdParameter:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: integer
        format: int64
        minimum: 1
    CommentIdParameter:
      name: commentId
      in: path
      required: true
      description: Идентификатор комментария
      schema:
        type: integer
        format: int64
        minimum: 1

paths:
  /api/v1/likes/post/{postId}/user/{userId}:
    post:
      tags:
        - Like Management
      summary: Поставить лайк на пост
      description: Создает новый лайк от указанного пользователя для указанного поста.
      operationId: addLikeToPost
      parameters:
        - $ref: '#/components/parameters/PostIdParameter'
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          description: Лайк успешно добавлен на пост (или уже существовал и возвращен текущий)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeDto'
        '400':
          description: Некорректный ID (например, <=0 из-за validateId) или другая ошибка валидации данных (например, пост уже лайкнут этим пользователем, если такая проверка есть в сервисе и возвращает DataValidationException).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Пост или пользователь не найден (если ваш postServiceUtils или likeService бросают исключение, которое маппится на 404).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Like Management
      summary: Удалить лайк с поста
      description: Удаляет лайк указанного пользователя с указанного поста.
      operationId: removeLikeFromPost
      parameters:
        - $ref: '#/components/parameters/PostIdParameter'
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '204':
          description: Лайк успешно удален с поста.
        '400':
          description: Некорректный ID (например, <=0 из-за validateId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Лайк не найден для удаления (согласно логике вашего контроллера, когда likeService.removeLikeFromPost возвращает false).

  /api/v1/likes/comment/{commentId}/user/{userId}:
    post:
      tags:
        - Like Management
      summary: Поставить лайк на комментарий
      description: Создает новый лайк от указанного пользователя для указанного комментария.
      operationId: addLikeToComment
      parameters:
        - $ref: '#/components/parameters/CommentIdParameter'
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '200':
          description: Лайк успешно добавлен на комментарий (или уже существовал)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeDto'
        '400':
          description: Некорректный ID или другая ошибка валидации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Комментарий или пользователь не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Like Management
      summary: Удалить лайк с комментария
      description: Удаляет лайк указанного пользователя с указанного комментария.
      operationId: removeLikeFromComment
      parameters:
        - $ref: '#/components/parameters/CommentIdParameter'
        - $ref: '#/components/parameters/UserIdParameter'
      responses:
        '204':
          description: Лайк успешно удален с комментария.
        '400':
          description: Некорректный ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Лайк не найден для удаления.
