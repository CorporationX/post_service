name: CI pipeline murloc11
on:
  push:
    branches:
      - murloc-master-stream11
  pull_request:
    branches:
      - murloc-master-stream11
    types: [ opened, reopened, synchronize, edited ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Step_1 - Checkout code
        uses: actions/checkout@v4

      - name: Step_2 - Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Step_3 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Step_4 - Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Step_5 - Build with Gradle
        run: ./gradlew build --no-daemon

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Step_6 - Checkout code
        uses: actions/checkout@v4

      - name: Step_7 - Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Step_8 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Step_9 - Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Step_10 - Run tests
        run: ./gradlew test --no-daemon