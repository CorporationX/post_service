name: CI

on:
  pull_request:
    branches:
      - 'kraken-master-stream10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: action/checkout@v3
      - name: set up JDK 17
        uses: action/setup-java@v3
        with:
          java-version: 17
      - name: Build with Gradle
        run: ./gradlew build
